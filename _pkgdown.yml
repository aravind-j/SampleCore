template:
  bootstrap: 5
  light-switch: yes
  math-rendering: mathjax
  bslib:
    base_font:
      google: Fira Sans
    heading_font:
      google: Fira Sans
    code_font:
      google: Fira Mono
    primary: '#ff0f0f'
    pkgdown-navbar-bg: '#0f0f0f'
    navbar-light-color: '#f9f9f9'
    navbar-light-hover-color: '#ff0f0f'
    navbar-light-brand-color: '#ff0f0f'
    navbar-light-brand-hover-color: '#ff0f0f'
    link-color: '#ff0f0f'
  includes:
    in_header: |
       <!-- Global site tag (gtag.js) - Google Analytics -->
       <script async src="https://www.googletagmanager.com/gtag/js?id=G-615WGTLM4G" ></script>
       <script>
         window.dataLayer = window.dataLayer || [];
         function gtag(){dataLayer.push(arguments);}
         gtag('js', new Date());

         gtag('config', 'G-615WGTLM4G');
       </script>
       <!-- Google tag (gtag.js) -->
    after_body: >
      <script data-goatcounter="https://samplecore.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>

deploy:
  install_metadata: yes
url: https://aravind-j.github.io/SampleCore/
navbar:
  structure:
    left:
    - home
    - reference
    - news
    right:
    - search
    - github
    - lightswitch
  components:
    home:
      icon: fa-home fa-lg
      text: Home
      href: index.html
    reference:
      icon: fa-code
      text: Reference
      href: reference/index.html
    articles:
      icon: far fa-file
      text: Articles
      menu:
        - text: Additional
        - text: ——–
        - text: Example Clustered Data
          href: articles/additional/Example_Clustered_Data.html
    news:
      icon: far fa-newspaper
      text: News
      href: news/index.html
    github:
      icon: fab fa-github-alt
      text: Github
      href: https://github.com/aravind-j/SampleCore
search:
  exclude: news/index.html

reference:
    - title: Allocation Methods
      contents:
         - '`allocate.basic`'
         - '`allocate.diversity`'
         - '`allocate.distance`'

    - title: Selection Methods
      contents:
         - '`select.random`'
         - '`select.diversity`'
         - '`select.distance`'

    - title: Helpers
      contents:
          - '`plot_dist`'

    - title: Datasets
      contents:
          - '`cassava_EC_gp`'


